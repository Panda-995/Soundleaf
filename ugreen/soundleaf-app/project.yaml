spec_version: "2.1"
app_id: com.panda.soundleaf
version: 1.2.0
support_arch:
  - amd64
  - arm64
supports:
  - app
  - pc
is_docker_app: true
only_admin: true
allow_add_access_path: true
port: 8780
open_type: tab
tag_types:
  - utility
depend_fw_version: 1.13.0.0000
depend_docker_version: 1.7.0.0000
license_agreement_link:
  - https://github.com/Panda-995/Soundleaf/blob/main/LICENSE
source_code_link:
  - https://github.com/Panda-995/Soundleaf
privacy_policy_link:
  - https://github.com/Panda-995/Soundleaf/blob/main/frontend/public/privacy-policy.html
parameters:
  - key: DATA_PATH
    type: path
    multi: false
    required: false
    changeable: true
    i18n:
      en-US:
        name: Data folder
        description: Choose a writable folder for the database, audiobook files and exports. Shared folders must be authorized for this app in UGOS Pro settings. Leave blank to use the app-internal ./data directory. Stop the app and move existing data before switching folders.
      zh-CN:
        name: 数据文件夹
        description: 选择存放数据库、音频成品与导出包的可读写文件夹；共享文件夹还需在绿联应用设置中授权本应用访问。留空则使用应用内置的 ./data 目录。更换文件夹前请先停用应用并迁移原数据。
i18n:
  en-US:
    name: Soundleaf
    description: Soundleaf is a self-hosted audiobook production tool for personal servers and NAS devices. Import TXT or unencrypted EPUB books, review chapter boundaries, edit narration segments and bind character voices. Optional AI services provide chapter, speaker and reading-style suggestions for review before applying them. Speech can use a configured cloud service or CPU-based local models downloaded separately, including built-in voices and reference-audio voice cloning. The application includes a pronunciation dictionary, segment regeneration, playback speed controls, progress saving, a persistent task queue and MP3, WAV or chaptered M4B export. Books, settings and audio are stored in the selected data folder. Cloud features send the selected text to the configured provider and may incur fees; model and service capabilities vary. Soundleaf is independently developed and has no affiliation, authorization or partnership with third-party brands mentioned. Licensed under GNU AGPL v3.0.
    author: 熊猫不是猫QAQ
    official: https://github.com/Panda-995/Soundleaf
    help: https://github.com/Panda-995/Soundleaf/issues
    publisher: 熊猫不是猫QAQ
    publisher_link: https://github.com/Panda-995
  zh-CN:
    name: 声页
    description: 声页 Soundleaf 是个人开发的自托管有声书制作工具，可部署在个人服务器或 NAS 上，通过浏览器导入 TXT、未加密 EPUB 小说，检查章节边界、编辑朗读片段并设置角色音色。可选 AI 服务提供分章、说话者与朗读风格建议，由用户预览后采纳；语音生成可连接自配云端接口，也可在下载所需模型后使用 CPU 本地合成，包括内置音色和参考音频音色克隆。套件提供读音词典、逐段重生成、波形试听、倍速播放、进度记忆、持久化任务队列，以及 MP3、WAV、带章节导航的 M4B 导出，用于整理文本并制作个人有声书。书籍、配置和音频保存在用户选择的数据文件夹，服务密钥加密保存。云端功能会将选定文本发送至用户配置的服务，可能产生费用；本地模型需另行下载，实际能力和耗时受设备及模型影响。项目采用 GNU AGPL v3.0 许可，由个人独立开发，与文中涉及的第三方品牌不存在隶属、授权或合作关系。
    author: 熊猫不是猫QAQ
    official: https://github.com/Panda-995/Soundleaf
    help: https://github.com/Panda-995/Soundleaf/issues
    publisher: 熊猫不是猫QAQ
    publisher_link: https://github.com/Panda-995
