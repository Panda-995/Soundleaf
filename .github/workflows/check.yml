name: Verify and build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # Tool versions match the local verification toolchain (ruff 0.16.x,
      # pytest 9.x); requirements.lock deliberately excludes dev tools.
      - run: pip install -r requirements.lock && pip install pytest==9.1.1 ruff==0.16.7
      # Build the frontend before pytest: the app only mounts its static
      # layer when dist exists, and tests should run production-like.
      - run: npm ci && npm run build
        working-directory: frontend
      - run: ruff check app tests && python -m pytest
  browser:
    # Full browser pass against the mock-provider fixture: the same 12-step
    # flow and theme/viewport audit the local verification checklist runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.lock pytest==9.1.1 && pip install -e .
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Start fixture (app :8781, mock provider :18781)
        run: |
          mkdir -p output/runtime
          PYTHONPATH=. DATA_DIR=.pytest_tmp/ci-fixture python tests/ui_fixture.py > output/runtime/fixture.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8781/ && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8781/ > /dev/null
      - run: node scripts/browser-smoke.cjs
      - run: node scripts/ui-audit.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: |
            output/runtime/
          if-no-files-found: ignore
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker compose config -q && docker compose build
      - run: mkdir -p data && sudo chown 1000:1000 data && docker compose up -d
      - run: |
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8780/health/ready && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8780/health/ready
          test "$(docker compose exec -T soundleaf id -u)" = 1000
      - if: always()
        run: docker compose logs && docker compose down
