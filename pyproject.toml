[project]
name = "soundleaf"
version = "1.1.0"
description = "Self-hosted novel audiobook studio"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "python-multipart>=0.0.20", "cryptography>=44", "beautifulsoup4>=4.12", "defusedxml>=0.7", "charset-normalizer>=3.4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11", "imageio-ffmpeg>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.setuptools.packages.find]
include = ["app*"]
